name: Run Zoom Bots

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web GitHub

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Bots script
        run: python zoom_bot.py
        
